<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sajilo explorer</title>
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Victor+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">

    <!-- ───────────── top bar ───────────── -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand" title="sajilo compiler explorer">
          <span class="brand-mark">sajilo</span><span class="brand-target">x86-64</span>
        </div>

        <nav class="menu">
          <div class="dropdown">
            <button class="menu-btn dropdown-toggle" id="btn-theme-toggle">
              theme <span class="menu-val" id="current-theme-label">catppuccin</span>
            </button>
            <div class="dropdown-menu" id="theme-menu">
              <a href="#" class="dropdown-item theme-item active" data-theme="catppuccin-mocha"><span class="swatch" style="background:#cba6f7"></span>catppuccin mocha</a>
              <a href="#" class="dropdown-item theme-item" data-theme="tokyo-night"><span class="swatch" style="background:#7aa2f7"></span>tokyo night</a>
              <a href="#" class="dropdown-item theme-item" data-theme="gruvbox-dark"><span class="swatch" style="background:#fabd2f"></span>gruvbox dark</a>
              <a href="#" class="dropdown-item theme-item" data-theme="nord"><span class="swatch" style="background:#88c0d0"></span>nord</a>
              <a href="#" class="dropdown-item theme-item" data-theme="vs-dark"><span class="swatch" style="background:#007acc"></span>vs dark</a>
            </div>
          </div>

          <div class="dropdown">
            <button class="menu-btn dropdown-toggle">samples</button>
            <div class="dropdown-menu">
              <a href="#" class="dropdown-item" data-template="empty">empty</a>
              <a href="#" class="dropdown-item" data-template="default">main function</a>
              <a href="#" class="dropdown-item" data-template="branching">branching: jaba / natra</a>
              <a href="#" class="dropdown-item" data-template="nested">nested blocks + return</a>
              <a href="#" class="dropdown-item" data-template="syscalls">syscalls: read / write / exit</a>
            </div>
          </div>

          <div class="dropdown">
            <button class="menu-btn dropdown-toggle">config</button>
            <div class="dropdown-menu settings">
              <label class="field">
                <span>compile endpoint</span>
                <input type="text" id="server-url-input" value="http://localhost:8080/compile" spellcheck="false">
              </label>
              <label class="field">
                <span>request format</span>
                <select id="request-format-select">
                  <option value="json" selected>json  { "code": ... }</option>
                  <option value="raw">text/plain</option>
                </select>
              </label>
              <label class="check"><input type="checkbox" id="auto-run-toggle"> build on change</label>
              <label class="check"><input type="checkbox" id="sync-scroll-toggle" checked> sync scroll</label>
            </div>
          </div>
        </nav>
      </div>

      <div class="topbar-right">
        <button class="act act-ghost" id="btn-clear" title="Clear the active file">clear</button>
        <button class="act" id="btn-run" title="Compile the active file to x86-64 assembly">
          <span class="btn-text">build</span><kbd class="kbd" data-keys="mod+enter"></kbd>
        </button>
        <button class="act act-primary" id="btn-exec" title="Build if needed, then assemble, link and execute">
          <span class="btn-text">run</span><kbd class="kbd" data-keys="mod+shift+enter"></kbd>
        </button>
      </div>
    </header>

    <!-- ───────────── editors ───────────── -->
    <main class="workspace" id="workspace">

      <section class="pane" id="pane-left">
        <div class="pane-bar">
          <div class="tabs-wrap">
            <div class="tabs" id="editor-tabs"></div>
            <button class="tab-add" id="btn-add-tab" title="New file">+</button>
          </div>
          <div class="tools">
            <button class="tool" id="btn-font-dec-left" title="Smaller font">a-</button>
            <button class="tool" id="btn-font-inc-left" title="Larger font">a+</button>
            <span class="tool-sep"></span>
            <button class="tool" id="btn-format-src" title="Format (Shift+Alt+F)">fmt</button>
            <button class="tool" id="btn-comment-src" title="Toggle comment (Ctrl+/)">#</button>
            <span class="tool-sep"></span>
            <button class="tool" id="btn-open-src" title="Open file (Ctrl+O)">open</button>
            <button class="tool" id="btn-download-src" title="Save file (Ctrl+S)">save</button>
            <button class="tool" id="btn-copy-src" title="Copy source">copy</button>
          </div>
        </div>
        <div class="editor" id="editor-left"></div>
      </section>

      <div class="splitter" id="splitter" title="Drag to resize · double-click to reset"></div>

      <section class="pane" id="pane-right">
        <div class="pane-bar">
          <div class="tabs-wrap">
            <div class="tabs">
              <div class="tab active static"><span class="tab-title">out.asm</span></div>
            </div>
            <span class="pane-state" id="build-state"></span>
          </div>
          <div class="tools">
            <button class="tool" id="btn-font-dec-right" title="Smaller font">a-</button>
            <button class="tool" id="btn-font-inc-right" title="Larger font">a+</button>
            <span class="tool-sep"></span>
            <button class="tool" id="btn-copy-ir" title="Copy assembly">copy</button>
            <button class="tool" id="btn-download-ir" title="Download out.asm">dl</button>
          </div>
        </div>
        <div class="editor" id="editor-right"></div>
      </section>

    </main>

    <!-- ───────────── terminal / logs drawer ───────────── -->
    <section class="drawer closed" id="console-drawer">
      <div class="drawer-resizer" id="drawer-resizer"></div>
      <div class="drawer-bar" id="drawer-toggle">
        <div class="drawer-tabs">
          <button class="drawer-tab active" data-panel="terminal-output" id="drawer-tab-terminal"><span class="idx">1</span>terminal</button>
          <button class="drawer-tab" data-panel="console-output" id="drawer-tab-logs"><span class="idx">2</span>logs <span class="count" id="log-count">0</span></button>
        </div>
        <div class="drawer-actions">
          <button class="tool" id="btn-clear-logs" title="Clear active panel">clear</button>
          <button class="tool drawer-chevron" id="btn-collapse-toggle" title="Toggle panel">▴</button>
        </div>
      </div>

      <div class="drawer-panel active" data-panel-id="terminal-output">
        <div class="drawer-body term" id="terminal-output">
          <div class="term-line term-dim"># build: compile .sj to x86-64 (nasm). run: assemble, link and execute in linux/amd64.</div>
        </div>
        <label class="stdin">
          <span class="stdin-prompt">stdin&gt;</span>
          <input type="text" id="terminal-stdin-input" spellcheck="false" autocomplete="off"
                 placeholder="input passed to read(); enter runs">
        </label>
      </div>

      <div class="drawer-panel" data-panel-id="console-output">
        <div class="drawer-body logs" id="console-output"></div>
      </div>
    </section>

    <!-- ───────────── statusline ───────────── -->
    <footer class="statusline bottom-bar">
      <div class="sl-left">
        <span class="sl-mode" id="sl-mode">sajilo</span>
        <span class="sl-item" id="cursor-pos">1:1</span>
        <span class="sl-item" id="code-length-display">0 B</span>
        <span class="sl-msg" id="status-msg"></span>
      </div>
      <div class="sl-right">
        <span class="sl-item" id="ir-stats">0 lines</span>
        <span class="sl-item" id="runner-label" title="Where x86-64 programs execute">runner: ?</span>
        <button class="sl-item sl-btn" id="status-endpoint-display" title="Click to change the compile endpoint">
          <span class="status-dot" id="server-status-pill"></span><span class="endpoint-val" id="server-status-text">localhost:8080</span>
        </button>
        <button class="sl-item sl-btn" id="toggle-console-btn" title="Toggle terminal">term</button>
      </div>
    </footer>

    <input type="file" id="hidden-file-input" accept=".sj,.txt" style="display:none">
    <div id="toast-container" hidden></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
